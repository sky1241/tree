// Band layout (same as skeleton_export)
const AERIAL_TOP = 30, AERIAL_BOT = SOL_Y - 40, UNDER_TOP = SOL_Y + 40, UNDER_BOT = 1090;
const allAerialLks = ["C", "F", "b", "B", "T"];
const allUnderLks = ["R-1", "R-2", "R-3", "R-4", "R-5"];

function computeBands() {
  const aerialBandH = (AERIAL_BOT - AERIAL_TOP) / allAerialLks.length;
  const underBandH = (UNDER_BOT - UNDER_TOP) / allUnderLks.length;
  const bandInfo = {};
  allAerialLks.forEach((lk, i) => {
    const top = AERIAL_TOP + i * aerialBandH;
    bandInfo[lk] = { lineY: top, centerY: top + aerialBandH / 2 };
  });
  allUnderLks.forEach((lk, i) => {
    const top = UNDER_TOP + i * underBandH;
    bandInfo[lk] = { lineY: top, centerY: top + underBandH / 2 };
  });
  return { bandInfo, aerialBandH, underBandH };
}

function buildOverlay(family) {
  const skel = _F[family];
  if (!skel) return '';
  const pw = skel.pw, nr = skel.nr;
  const { bandInfo } = computeBands();

  // Adjusted positions
  const iPos = {};
  for (const lk of [...allAerialLks, ...allUnderLks]) {
    const levelNodes = skel.nodes.filter(n => n.lk === lk);
    if (!levelNodes.length) continue;
    const origCenterY = levelNodes.reduce((s, n) => s + n.y, 0) / levelNodes.length;
    const dy = bandInfo[lk].centerY - origCenterY;
    levelNodes.forEach(n => { iPos[n.id] = { x: n.x, y: Math.round(n.y + dy) }; });
  }

  let svg = '';

  // Defs
  svg += `<defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="tshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.95"/>
    </filter>
  </defs>`;

  // Level separator lines
  const lineColor = "rgba(255,255,255,0.25)";
  for (const lk of [...allAerialLks, ...allUnderLks]) {
    const bi = bandInfo[lk];
    if (!bi) continue;
    // Level label on left
    const lvl = LEVELS[lk];
    svg += `<line x1="40" y1="${Math.round(bi.lineY)}" x2="882" y2="${Math.round(bi.lineY)}" stroke="${lineColor}" stroke-width="0.8" stroke-dasharray="4,6"/>`;
    if (lvl) {
      svg += `<text x="45" y="${Math.round(bi.lineY + 13)}" fill="rgba(255,255,255,0.5)" font-size="9" font-family="JetBrains Mono, monospace" font-weight="600" filter="url(#tshadow)">${lvl.label}</text>`;
    }
  }
  // Bottom lines
  svg += `<line x1="40" y1="${Math.round(AERIAL_BOT)}" x2="882" y2="${Math.round(AERIAL_BOT)}" stroke="${lineColor}" stroke-width="0.8" stroke-dasharray="4,6"/>`;
  svg += `<line x1="40" y1="${Math.round(UNDER_BOT)}" x2="882" y2="${Math.round(UNDER_BOT)}" stroke="${lineColor}" stroke-width="0.8" stroke-dasharray="4,6"/>`;

  // SOL line
  svg += `<line x1="40" y1="${SOL_Y}" x2="882" y2="${SOL_Y}" stroke="#8B6914" stroke-width="2" opacity="0.5"/>`;
  svg += `<text x="850" y="${SOL_Y - 5}" fill="#8B6914" font-size="10" font-family="JetBrains Mono, monospace" font-weight="600" text-anchor="end" opacity="0.7">SOL</text>`;

  // Center axis
  svg += `<line x1="${CENTER_X}" y1="60" x2="${CENTER_X}" y2="1160" stroke="rgba(139,105,20,0.12)" stroke-width="1" stroke-dasharray="6,4"/>`;

  // Connections
  skel.nodes.forEach(n => {
    const pos = iPos[n.id];
    if (!pos || n.lk === "T") return;
    let pp;
    if (n.pid && iPos[n.pid]) { pp = iPos[n.pid]; }
    else if (n.lk === "R-1") { pp = { x: CENTER_X, y: SOL_Y + 15 }; }
    else { pp = { x: CENTER_X, y: pos.y - 15 }; }
    const cx = pp.x + (pos.x - pp.x) * 0.55;
    const cy = pp.y + (pos.y - pp.y) * 0.3;
    const sw = pw[n.lk] || 1.0;
    svg += `<path d="M${pp.x},${pp.y} Q${cx},${cy} ${pos.x},${pos.y}" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="${sw}"/>`;
  });

  // Trunk or buisson central line
  if (skel.trunkTopY !== null) {
    const topY = bandInfo[allAerialLks[0]]?.lineY || AERIAL_TOP;
    svg += `<line x1="${CENTER_X}" y1="${Math.round(topY)}" x2="${CENTER_X}" y2="${SOL_Y}" stroke="rgba(255,255,255,0.4)" stroke-width="${pw['T']}"/>`;
  } else {
    const bNodes = skel.nodes.filter(n => n.lk === "B");
    if (bNodes.length) {
      const bCenterY = bNodes.reduce((s, n) => s + (iPos[n.id]?.y || n.y), 0) / bNodes.length;
      svg += `<line x1="${CENTER_X}" y1="${Math.round(bCenterY)}" x2="${CENTER_X}" y2="${SOL_Y}" stroke="rgba(255,255,255,0.35)" stroke-width="${pw['B'] * 0.6}"/>`;
    }
  }
  svg += `<line x1="${CENTER_X}" y1="${SOL_Y}" x2="${CENTER_X}" y2="${Math.round(UNDER_TOP + 5)}" stroke="rgba(255,255,255,0.3)" stroke-width="${(pw['T'] || 2) * 0.85}"/>`;

  // Nodes + labels
  skel.nodes.forEach(n => {
    const pos = iPos[n.id];
    if (!pos) return;
    const r = nr[n.lk] || 5;
    const lev = LEVELS[n.lk];
    const above = lev?.zone === "aerial";
    const ly = above ? pos.y - r - 6 : pos.y + r + 14;

    svg += `<circle cx="${pos.x}" cy="${pos.y}" r="${r}" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.7)" stroke-width="1.2" filter="url(#glow)"/>`;
    svg += `<circle cx="${pos.x}" cy="${pos.y}" r="${Math.max(1.5, r * 0.25)}" fill="rgba(255,255,255,0.9)"/>`;
    svg += `<text x="${pos.x}" y="${ly}" fill="rgba(255,255,255,0.85)" font-size="8" font-family="JetBrains Mono, monospace" text-anchor="middle" font-weight="400" filter="url(#tshadow)">${n.label}</text>`;
  });

  return svg;
}

// Init
const sel = document.getElementById('familySelect');
Object.keys(_F).forEach(f => {
  const opt = document.createElement('option');
  opt.value = f;
  opt.textContent = `${_F[f].emoji} ${_F[f].fullName}`;
  if (f === 'buisson') opt.selected = true;
  sel.appendChild(opt);
});

function render() {
  document.getElementById('overlaySvg').innerHTML = buildOverlay(sel.value);
}

sel.addEventListener('change', render);

// Background image upload
document.getElementById('bgInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.getElementById('bgImg');
    img.src = ev.target.result;
    img.style.display = 'block';
  };
  reader.readAsDataURL(file);
});

render();
</script>
</body>
</html>
