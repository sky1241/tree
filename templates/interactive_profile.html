<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winter Tree — HSBC-algo-genetic</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap');

  :root {
    --bg: #050805;
    --bg2: #0a0d08;
    --gold: #8B6914;
    --gold-light: #c4a035;
    --text: #EDE5DB;
    --text-dim: rgba(237,229,219,0.4);
    --green: #28c862;
    --orange: #FFB74D;
    --red: #FF5252;
    --aerial-1: #28c862;
    --aerial-2: #32b555;
    --aerial-3: #38a048;
    --aerial-4: #3d8a3a;
    --aerial-5: #5a9a35;
    --under-1: #9a7453;
    --under-2: #8a6344;
    --under-3: #7a5235;
    --under-4: #6b4226;
    --under-5: #5c3317;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* ── LAYOUT ── */
  .app {
    display: flex;
    height: 100vh;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 300px;
    min-width: 300px;
    background: var(--bg2);
    border-right: 1px solid rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 10;
  }

  .sidebar-header {
    padding: 20px 16px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .sidebar-header .brand {
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.6;
  }

  .sidebar-header .project-name {
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 1px;
    margin-top: 6px;
  }

  .sidebar-header .family-tag {
    display: inline-block;
    margin-top: 8px;
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 12px;
    background: rgba(139,105,20,0.15);
    color: var(--gold-light);
    letter-spacing: 1px;
  }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .stat-card {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.03);
    border-radius: 6px;
    padding: 10px;
  }

  .stat-card .val { font-size: 15px; font-weight: 300; }
  .stat-card .lbl { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.3; margin-top: 2px; }

  /* Status bar */
  .status-bar {
    display: flex;
    gap: 6px;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .status-pill {
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    opacity: 0.7;
  }
  .status-pill:hover { opacity: 1; transform: scale(1.05); }
  .status-pill.active { opacity: 1; }
  .status-pill.s-done { background: rgba(40,200,98,0.15); color: var(--green); }
  .status-pill.s-wip { background: rgba(255,183,77,0.15); color: var(--orange); }
  .status-pill.s-todo { background: rgba(255,82,82,0.15); color: var(--red); }
  .status-pill.s-all { background: rgba(255,255,255,0.06); color: var(--text); }

  /* Node list */
  .node-list {
    flex: 1;
    overflow-y: auto;
    padding: 0;
  }

  .node-list::-webkit-scrollbar { width: 4px; }
  .node-list::-webkit-scrollbar-track { background: transparent; }
  .node-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

  /* Interactive Table */
  .node-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 10px;
  }

  .node-table thead {
    position: sticky;
    top: 0;
    background: var(--bg2);
    z-index: 2;
  }

  .node-table th {
    padding: 6px 8px;
    text-align: left;
    font-size: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.3;
    font-weight: 400;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .node-table .level-row td {
    padding: 12px 8px 4px;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.25;
    border: none;
  }

  .node-table .node-row {
    cursor: pointer;
    transition: all 0.15s;
    border-left: 2px solid transparent;
  }

  .node-table .node-row:hover {
    background: rgba(255,255,255,0.04);
  }

  .node-table .node-row.selected {
    background: rgba(139,105,20,0.12);
    border-left-color: var(--gold);
  }

  .node-table .node-row.highlight {
    background: rgba(139,105,20,0.08);
    border-left-color: var(--gold-light);
  }

  .node-table .node-row.hidden { display: none; }

  .node-table td {
    padding: 6px 8px;
    vertical-align: middle;
    border-bottom: 1px solid rgba(255,255,255,0.02);
  }

  .node-table .col-dot { width: 16px; }
  .node-table .col-id { width: 32px; opacity: 0.35; font-size: 9px; }
  .node-table .col-label {
    opacity: 0.7;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 140px;
  }
  .node-table .col-conf {
    width: 40px;
    text-align: right;
    opacity: 0.3;
    font-size: 8px;
  }
  .node-table .col-status {
    width: 24px;
    text-align: center;
    font-size: 10px;
  }

  .node-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .sidebar-footer {
    padding: 12px 16px;
    font-size: 8px;
    opacity: 0.15;
    letter-spacing: 2px;
    text-align: center;
    border-top: 1px solid rgba(255,255,255,0.04);
  }

  /* ── MAIN CANVAS ── */
  .canvas {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: grab;
  }

  .canvas:active { cursor: grabbing; }

  .canvas-inner {
    position: absolute;
    transform-origin: 0 0;
    transition: transform 0.1s ease-out;
  }

  .canvas-inner img {
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* SVG overlay */
  .tree-svg {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }

  .tree-svg .node-g { pointer-events: all; cursor: pointer; }
  .tree-svg .node-g:hover .node-ring { opacity: 1; }
  .tree-svg .node-g.selected .node-ring { opacity: 1; r: 18; }

  .node-ring {
    opacity: 0;
    transition: all 0.25s ease;
  }

  @keyframes nodePulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  .tree-svg .node-g.highlight .node-ring {
    opacity: 1;
    stroke-width: 3;
    animation: nodePulse 0.8s ease-in-out infinite;
  }
  .tree-svg .node-g.highlight .node-bg { filter: url(#glow); }

  .connector-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
  }
  .connector-line {
    stroke: var(--gold);
    stroke-width: 1;
    stroke-dasharray: 4,4;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .connector-line.active { opacity: 0.4; }

  .level-line {
    opacity: 0.12;
    transition: opacity 0.3s;
  }

  .level-label-bg {
    opacity: 0;
  }

  /* ── DETAIL PANEL ── */
  .detail-panel {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 320px;
    background: rgba(10,13,8,0.95);
    border: 1px solid rgba(139,105,20,0.2);
    border-radius: 8px;
    backdrop-filter: blur(20px);
    z-index: 20;
    transform: translateX(360px);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
  }

  .detail-panel.open { transform: translateX(0); }

  .detail-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 24px;
    height: 24px;
    border: none;
    background: rgba(255,255,255,0.06);
    color: var(--text);
    border-radius: 50%;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .detail-close:hover { background: rgba(255,255,255,0.12); }

  .detail-header {
    padding: 16px 16px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .detail-header .detail-id {
    font-size: 10px;
    opacity: 0.35;
    letter-spacing: 2px;
  }

  .detail-header .detail-label {
    font-size: 13px;
    font-weight: 400;
    margin-top: 4px;
    line-height: 1.4;
  }

  .detail-body { padding: 12px 16px; }

  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 11px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }

  .detail-row .dr-label { opacity: 0.4; }
  .detail-row .dr-value { font-weight: 500; }

  .confidence-bar-detail {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
  }

  .confidence-bar-detail .fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  /* ── ZOOM CONTROLS ── */
  .zoom-controls {
    position: absolute;
    bottom: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 15;
  }

  .zoom-btn {
    width: 36px;
    height: 36px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(10,13,8,0.9);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
  }

  .zoom-btn:hover { background: rgba(139,105,20,0.2); border-color: rgba(139,105,20,0.3); }

  .zoom-level {
    text-align: center;
    font-size: 9px;
    opacity: 0.3;
    padding: 2px 0;
  }

  /* ── MINIMAP ── */
  .minimap {
    position: absolute;
    bottom: 20px;
    left: 20px;
    width: 100px;
    height: 135px;
    border: 1px solid rgba(139,105,20,0.2);
    border-radius: 4px;
    overflow: hidden;
    z-index: 15;
    background: rgba(10,13,8,0.8);
    backdrop-filter: blur(10px);
  }

  .minimap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.4;
  }

  .minimap-viewport {
    position: absolute;
    border: 1px solid var(--gold);
    background: rgba(139,105,20,0.1);
    pointer-events: none;
  }

  /* ── KEYBOARD HINT ── */
  .kb-hint {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    opacity: 0.15;
    letter-spacing: 1px;
    z-index: 15;
    white-space: nowrap;
  }

  .kb-hint kbd {
    background: rgba(255,255,255,0.08);
    padding: 1px 5px;
    border-radius: 3px;
    margin: 0 2px;
  }
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="brand">Winter Tree</div>
      <div class="project-name" id="projectName"></div>
      <div class="family-tag" id="familyTag"></div>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="status-bar" id="statusBar"></div>

    <div class="node-list" id="nodeList"></div>

    <div class="sidebar-footer">racines > arbre — 2026</div>
  </div>

  <!-- Connector overlay -->
  <svg class="connector-svg" id="connectorSvg" xmlns="http://www.w3.org/2000/svg"></svg>

  <!-- MAIN CANVAS -->
  <div class="canvas" id="canvas">
    <div class="canvas-inner" id="canvasInner">
      <img id="treeImg" alt="Winter Tree"/>
      <svg class="tree-svg" id="treeSvg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <!-- Detail panel -->
    <div class="detail-panel" id="detailPanel">
      <button class="detail-close" id="detailClose">×</button>
      <div class="detail-header">
        <div class="detail-id" id="detailId"></div>
        <div class="detail-label" id="detailLabel"></div>
      </div>
      <div class="detail-body" id="detailBody"></div>
    </div>

    <!-- Zoom controls -->
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomIn">+</button>
      <div class="zoom-level" id="zoomLevel">100%</div>
      <button class="zoom-btn" id="zoomOut">−</button>
      <button class="zoom-btn" id="zoomFit" style="margin-top:4px; font-size:11px;">⊡</button>
    </div>

    <!-- Minimap -->
    <div class="minimap" id="minimap">
      <img id="minimapImg" alt="minimap"/>
      <div class="minimap-viewport" id="minimapViewport"></div>
    </div>

    <div class="kb-hint">
      <kbd>scroll</kbd> zoom · <kbd>drag</kbd> pan · <kbd>click</kbd> node · <kbd>Esc</kbd> fermer
    </div>
  </div>
</div>

<script>
// ── TREE DATA (injected by engine.py) ──
const TREE_DATA = __TREE_JSON__;
const IMG_SRC = __IMG_SRC__;

// ── LEVEL CONFIG ──
const LEVELS = {
  "C":    { y: 105,  label: "CIME",             color: "#28c862", zone: "aerial" },
  "F":    { y: 185,  label: "FEUILLES",          color: "#32b555", zone: "aerial" },
  "b":    { y: 270,  label: "RAMEAUX",            color: "#38a048", zone: "aerial" },
  "B":    { y: 385,  label: "BRANCHES",           color: "#3d8a3a", zone: "aerial" },
  "T":    { y: 480,  label: "TRONC",              color: "#5a9a35", zone: "aerial" },
  "R-1":  { y: 605,  label: "R.STRUCTURELLES",   color: "#9a7453", zone: "under" },
  "R-2":  { y: 700,  label: "R.PIVOTANTES",      color: "#8a6344", zone: "under" },
  "R-3":  { y: 790,  label: "RADICELLES",        color: "#7a5235", zone: "under" },
  "R-4":  { y: 885,  label: "POILS ABSORBANTS",  color: "#6b4226", zone: "under" },
  "R-5":  { y: 980,  label: "MYCORHIZES",       color: "#5c3317", zone: "under" },
};

const IMG_W = 922, IMG_H = 1244;
const CENTER_X = 461;
const SOL_Y = 575;

// ── STATE ──
let zoom = 0.65;
let panX = 0, panY = 0;
let isDragging = false, dragStartX, dragStartY, panStartX, panStartY;
let selectedNodeId = null;
let statusFilter = "all";

// ── HELPERS ──
function nodeLevelKey(node) {
  if (node.level === "R" && node.depth != null) return `R${node.depth}`;
  if (node.level === "M") return "R-5";
  return node.level;
}

function statusColor(status) {
  return { done: "var(--green)", wip: "var(--orange)", todo: "var(--red)" }[status] || "#666";
}

function statusIcon(status) {
  return { done: "✓", wip: "◐", todo: "○" }[status] || "?";
}

// ── INIT ──
function init() {
  const name = (TREE_DATA.idea || "Projet").replace("[scanned] ", "");
  const family = TREE_DATA.family_name || "Inconnu";
  const emoji = TREE_DATA.family_emoji || "🌳";
  const stats = TREE_DATA.stats || {};
  const nodes = TREE_DATA.nodes || [];

  // Header
  document.getElementById("projectName").textContent = `${emoji} ${name}`;
  document.getElementById("familyTag").textContent = `${family} · ${stats.total_code_lines?.toLocaleString() || 0} lignes`;

  // Stats grid
  const grid = document.getElementById("statsGrid");
  const statItems = [
    { val: stats.total_code_lines?.toLocaleString() || "0", lbl: "LIGNES" },
    { val: stats.total_files?.toLocaleString() || "0", lbl: "FICHIERS" },
    { val: `${(stats.data_weight_mb || 0).toFixed(0)} Mo`, lbl: "DATA" },
    { val: nodes.length, lbl: "NŒUDS" },
  ];
  grid.innerHTML = statItems.map(s => `
    <div class="stat-card">
      <div class="val">${s.val}</div>
      <div class="lbl">${s.lbl}</div>
    </div>
  `).join("");

  // Status bar
  const doneN = nodes.filter(n => n.status === "done").length;
  const wipN = nodes.filter(n => n.status === "wip").length;
  const todoN = nodes.filter(n => n.status === "todo").length;
  const bar = document.getElementById("statusBar");
  bar.innerHTML = `
    <div class="status-pill s-all active" data-filter="all">ALL ${nodes.length}</div>
    <div class="status-pill s-done" data-filter="done">✓ ${doneN}</div>
    <div class="status-pill s-wip" data-filter="wip">◐ ${wipN}</div>
    <div class="status-pill s-todo" data-filter="todo">○ ${todoN}</div>
  `;
  bar.querySelectorAll(".status-pill").forEach(pill => {
    pill.addEventListener("click", () => {
      statusFilter = pill.dataset.filter;
      bar.querySelectorAll(".status-pill").forEach(p => p.classList.remove("active"));
      pill.classList.add("active");
      filterNodes();
    });
  });

  // Node list grouped by level
  buildNodeList(nodes);

  // Image
  const img = document.getElementById("treeImg");
  img.src = IMG_SRC;
  img.width = IMG_W;
  img.height = IMG_H;
  document.getElementById("minimapImg").src = IMG_SRC;

  img.onload = () => {
    buildSVG(nodes);
    fitToScreen();
    updateMinimap();
  };

  // Events
  setupCanvasEvents();
  setupZoomControls();
  document.getElementById("detailClose").addEventListener("click", closeDetail);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });
}

// ── NODE LIST ──
function buildNodeList(nodes) {
  const list = document.getElementById("nodeList");
  const grouped = {};

  nodes.forEach(n => {
    const key = nodeLevelKey(n);
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(n);
  });

  let html = `<table class="node-table">
    <thead><tr>
      <th></th><th>ID</th><th>Label</th><th>Conf</th><th>St</th>
    </tr></thead><tbody>`;

  const levelOrder = ["C", "F", "b", "B", "T", "R-1", "R-2", "R-3", "R-4", "R-5"];

  for (const lk of levelOrder) {
    const lev = LEVELS[lk];
    const group = grouped[lk];
    if (!group || !lev) continue;

    html += `<tr class="level-row"><td colspan="5">${lev.label}</td></tr>`;
    for (const n of group) {
      html += `
      <tr class="node-row" data-id="${n.id}" data-status="${n.status}" data-level="${lk}">
        <td class="col-dot"><div class="node-dot" style="background:${statusColor(n.status)}"></div></td>
        <td class="col-id">${n.id}</td>
        <td class="col-label" title="${n.label}">${n.label}</td>
        <td class="col-conf">${n.confidence || 0}%</td>
        <td class="col-status">${statusIcon(n.status)}</td>
      </tr>`;
    }
  }
  html += `</tbody></table>`;
  list.innerHTML = html;

  list.querySelectorAll(".node-row").forEach(row => {
    row.addEventListener("click", () => selectNode(row.dataset.id));
    row.addEventListener("mouseenter", () => highlightTreeNode(row.dataset.id, true));
    row.addEventListener("mouseleave", () => highlightTreeNode(row.dataset.id, false));
  });
}

function filterNodes() {
  document.querySelectorAll(".node-row").forEach(row => {
    if (statusFilter === "all" || row.dataset.status === statusFilter) {
      row.classList.remove("hidden");
    } else {
      row.classList.add("hidden");
    }
  });
  // Also filter SVG nodes
  document.querySelectorAll(".node-g").forEach(g => {
    const status = g.dataset.status;
    if (statusFilter === "all" || status === statusFilter) {
      g.style.opacity = "1";
    } else {
      g.style.opacity = "0.12";
    }
  });
}

// ── SVG OVERLAY ──
function buildSVG(nodes) {
  const svg = document.getElementById("treeSvg");
  svg.setAttribute("width", IMG_W);
  svg.setAttribute("height", IMG_H);
  svg.setAttribute("viewBox", `0 0 ${IMG_W} ${IMG_H}`);

  let svgHTML = `
    <defs>
      <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="6" result="b"/>
        <feComposite in="SourceGraphic" in2="b" operator="over"/>
      </filter>
      <filter id="textSh" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#000" flood-opacity="0.95"/>
      </filter>
    </defs>

    <!-- Axe central -->
    <line x1="${CENTER_X}" y1="60" x2="${CENTER_X}" y2="1160"
          stroke="rgba(139,105,20,0.1)" stroke-width="1" stroke-dasharray="6,4"/>

    <!-- SOL -->
    <line x1="40" y1="${SOL_Y}" x2="882" y2="${SOL_Y}"
          stroke="var(--gold)" stroke-width="2" opacity="0.3"/>
    <text x="870" y="${SOL_Y - 6}" fill="var(--gold)" font-size="11" font-weight="600"
          font-family="JetBrains Mono, monospace" opacity="0.5" text-anchor="end"
          filter="url(#textSh)">SOL</text>
  `;

  // Level lines & labels

  const ROOT_BOT_L = { x: 100, y: 1080 };

  function canopyWidthAt(y) {
    const t = Math.max(0, Math.min(1, (y - APEX.y) / (BASE_L.y - APEX.y)));
    return {
      left:  APEX.x + (BASE_L.x - APEX.x) * t,
      right: APEX.x + (BASE_R.x - APEX.x) * t

  function rootWidthAt(y) {
    const t = Math.max(0, Math.min(1, (y - ROOT_TOP_L.y) / (ROOT_BOT_L.y - ROOT_TOP_L.y)));
    return {
      left:  ROOT_TOP_L.x + (ROOT_BOT_L.x - ROOT_TOP_L.x) * t,

    // Grimpante, mince, dépend de l'hôte, pas de structure porteuse
    // L1:HOST_DEPENDENT L2:NO_STRUCTURAL_COST L3:PARASITIC L4:DIES_WITH_HOST
    liane: {
      trunkTopY: 90,
      nodes: [
        { id:"iC1", lk:"C", label:"Tests / CI",       x:461, y:100, pid:null },
        { id:"iC2", lk:"C", label:"Release / CD",     x:430, y:115, pid:null },
        { id:"iF1", lk:"F", label:"API endpoints",    x:400, y:185, pid:"ib1" },
        { id:"iF2", lk:"F", label:"UI composants",    x:520, y:190, pid:"ib2" },
        { id:"iF3", lk:"F", label:"Exports / CLI",    x:360, y:215, pid:"ib3" },
        { id:"ib1", lk:"b", label:"Vrille 1",         x:415, y:275, pid:"iB1" },
        { id:"ib2", lk:"b", label:"Vrille 2",         x:505, y:280, pid:"iB2" },
        { id:"ib3", lk:"b", label:"Vrille 3",         x:380, y:310, pid:"iB1" },
        { id:"iB1", lk:"B", label:"Fork A",           x:430, y:395, pid:null },
        { id:"iB2", lk:"B", label:"Fork B",           x:490, y:400, pid:null },
        { id:"iT1", lk:"T", label:"Tige principale",  x:461, y:510, pid:null },
        { id:"iR11", lk:"R-1", label:"Framework web",   x:500, y:625, pid:null },
        { id:"iR12", lk:"R-1", label:"Framework data",  x:422, y:630, pid:null },
        { id:"iR21", lk:"R-2", label:"Archi DB",        x:530, y:725, pid:"iR11" },
        { id:"iR22", lk:"R-2", label:"Archi API",       x:395, y:732, pid:"iR12" },
        { id:"iR31", lk:"R-3", label:"Contrainte 1",    x:560, y:815, pid:"iR21" },
        { id:"iR32", lk:"R-3", label:"Contrainte 2",    x:365, y:822, pid:"iR22" },
        { id:"iR41", lk:"R-4", label:"Licence",         x:590, y:908, pid:"iR31" },
        { id:"iR42", lk:"R-4", label:"Conformite",      x:335, y:915, pid:"iR32" },
        { id:"iR51", lk:"R-5", label:"Algorithmes",     x:620, y:998, pid:"iR41" },
        { id:"iR52", lk:"R-5", label:"Hardware",        x:305, y:1005, pid:"iR42" },
      ],
      pw: { "T":1.5,"B":1.2,"b":1.0,"C":0.6,"F":0.8,"R-1":1.5,"R-2":1.2,"R-3":0.8,"R-4":0.5,"R-5":0.3 },
      nr: { "T":15,"B":12,"b":10,"F":8,"C":6,"R-1":12,"R-2":10,"R-3":8,"R-4":5,"R-5":4 },
    },
  };

  // ── Sélection du squelette actif ──
  const skel = _F[family] || _F.conifere;
  const idealTree = skel.nodes;
  const PIPE_WIDTH = skel.pw;
  const NODE_R = skel.nr;

  // Positions = coordonnées pixel directes
  const iPos = {};
  idealTree.forEach(n => { iPos[n.id] = { x: n.x, y: n.y }; });

  // ────── RENDER: TRONC (pipe model, adapté par famille) ──────
  if (skel.trunkTopY !== null) {
    svgHTML += `<line x1="${CENTER_X}" y1="${skel.trunkTopY}" x2="${CENTER_X}" y2="${SOL_Y}"
      stroke="rgba(255,255,255,0.5)" stroke-width="${PIPE_WIDTH['T']}"/>`;
  }
  svgHTML += `<line x1="${CENTER_X}" y1="${SOL_Y}" x2="${CENTER_X}" y2="600"
    stroke="rgba(255,255,255,0.35)" stroke-width="${PIPE_WIDTH['T'] * 0.85}"/>`;

  // ────── RENDER: CONNEXIONS (pipe model — épaisseur proportionnelle) ──────
  idealTree.forEach(n => {
    const pos = iPos[n.id];
    if (!pos || n.lk === "T") return;

    let pp;
    if (n.pid && iPos[n.pid]) { pp = iPos[n.pid]; }
    else if (n.lk === "R-1") { pp = { x: CENTER_X, y: SOL_Y + 15 }; }
    else { pp = { x: CENTER_X, y: n.y - 15 }; }

    const cx = pp.x + (pos.x - pp.x) * 0.55;
    const cy = pp.y + (pos.y - pp.y) * 0.3;
    const sw = PIPE_WIDTH[n.lk] || 1.0;

    svgHTML += `<path d="M${pp.x},${pp.y} Q${cx},${cy} ${pos.x},${pos.y}"
      fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="${sw}"/>`;
  });

  // ────── RENDER: NŒUDS (blanc, taille hiérarchique) ──────
  idealTree.forEach(n => {
    const pos = iPos[n.id];
    if (!pos) return;
    const r = NODE_R[n.lk] || 5;

    svgHTML += `<circle cx="${pos.x}" cy="${pos.y}" r="${r}"
      fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"
      filter="url(#glow)"/>`;
    svgHTML += `<circle cx="${pos.x}" cy="${pos.y}" r="${Math.max(1.5, r * 0.25)}" fill="#fff"/>`;

    // Label au-dessus (aérien) ou en-dessous (souterrain)
    const lev = LEVELS[n.lk];
    const above = lev?.zone === "aerial";
    const ly = above ? pos.y - r - 4 : pos.y + r + 12;
    svgHTML += `<text x="${pos.x}" y="${ly}" fill="rgba(255,255,255,0.7)" font-size="7"
      font-family="JetBrains Mono, monospace" text-anchor="middle"
      filter="url(#textSh)">${n.label}</text>`;
  });

  // ────── DÉSIGNATIONS TECHNIQUES (côté droit) ──────
  // Mapping logiciel de chaque couche anatomique
  const TECH_LABELS = [
    { y: 100,  lk: "C",   ana: "+5 CIME",            tech: "Tests · CI/CD · Release" },
    { y: 215,  lk: "F",   ana: "+4 FEUILLES",         tech: "API endpoints · UI · Outputs" },
    { y: 330,  lk: "b",   ana: "+3 RAMEAUX",           tech: "Sub-features · Sub-modules" },
    { y: 440,  lk: "B",   ana: "+2 BRANCHES",          tech: "Modules principaux" },
    { y: 530,  lk: "T",   ana: "+1 TRONC",             tech: "Core engine · Pipeline" },
    { y: 575,  lk: "SOL", ana: " 0 SOL",               tech: "Interface humain ↔ machine" },
    { y: 650,  lk: "R-1", ana: "-1 R.STRUCT.",         tech: "Frameworks · APIs · Deps" },
    { y: 760,  lk: "R-2", ana: "-2 R.PIVOT.",          tech: "Architecture · Décisions" },
    { y: 870,  lk: "R-3", ana: "-3 RADICELLES",        tech: "Contraintes métier" },
    { y: 960,  lk: "R-4", ana: "-4 POILS",             tech: "Licence · Conformité" },
    { y: 1060, lk: "R-5", ana: "-5 MYCORHIZES",       tech: "Algo fondamentaux · Hardware" },
  ];
  const techX = 710;
  TECH_LABELS.forEach(t => {
    const col = LEVELS[t.lk]?.color || "rgba(255,255,255,0.4)";
    // Ligne de repère
    svgHTML += `<line x1="${techX - 8}" y1="${t.y}" x2="${techX}" y2="${t.y}"
      stroke="${col}" stroke-width="0.8" opacity="0.5"/>`;
    // Nom anatomique
    svgHTML += `<text x="${techX + 4}" y="${t.y - 3}" fill="${col}" font-size="8"
      font-family="JetBrains Mono, monospace" font-weight="600" opacity="0.7"
      filter="url(#textSh)">${t.ana}</text>`;
    // Désignation technique
    svgHTML += `<text x="${techX + 4}" y="${t.y + 9}" fill="rgba(255,255,255,0.45)" font-size="7"
      font-family="JetBrains Mono, monospace" font-style="italic"
      filter="url(#textSh)">${t.tech}</text>`;
  });

  // ────── REPO NODES (visibles, mappes sur squelette) ──────
  const idealByLevel = {};
  idealTree.forEach(n => {
    if (!idealByLevel[n.lk]) idealByLevel[n.lk] = [];
    idealByLevel[n.lk].push(n);
  });

  const posMap = {};
  for (const [lk, lev] of Object.entries(LEVELS)) {
    const repoGroup = grouped[lk] || [];
    const idealGroup = idealByLevel[lk] || [];
    repoGroup.forEach((n, i) => {
      if (i < idealGroup.length) {
        const ideal = idealGroup[i];
        posMap[n.id] = { x: ideal.x, y: ideal.y };
      } else {
        const side = i % 2 === 0 ? 1 : -1;
        const bounds = lev.zone === "aerial" ? canopyWidthAt(lev.y) : rootWidthAt(lev.y);
        const half = side > 0 ? Math.max(bounds.right - CENTER_X, 30) : Math.max(CENTER_X - bounds.left, 30);
        const x = lk === "T" ? CENTER_X : CENTER_X + side * half * (0.2 + (i * 0.12));
        posMap[n.id] = { x: Math.round(x), y: lev.y };
      }
    });
  }

  nodes.forEach(n => {
    const pos = posMap[n.id] || { x: CENTER_X, y: 500 };
    const lk = nodeLevelKey(n);
    const sc = statusColor(n.status);
    const r = NODE_R[lk] || 8;
    svgHTML += `
    <g class="node-g" data-id="${n.id}" data-status="${n.status}" data-level="${lk}">
      <circle class="node-ring" cx="${pos.x}" cy="${pos.y}" r="${r + 8}"
        fill="none" stroke="${sc}" stroke-width="2"/>
      <circle class="node-bg" cx="${pos.x}" cy="${pos.y}" r="${r * 0.6}"
        fill="rgba(0,0,0,0.4)" stroke="${sc}" stroke-width="1.5"/>
      <circle class="node-core" cx="${pos.x}" cy="${pos.y}" r="${Math.max(2, r * 0.2)}"
        fill="${sc}"/>
    </g>`;
  });

  // L\u00c9GENDE
  const legX = 50, legY = 1110;
  svgHTML += `
    <rect x="${legX-5}" y="${legY-12}" width="220" height="48" rx="4"
      fill="rgba(0,0,0,0.5)" stroke="rgba(218,165,32,0.2)" stroke-width="0.5"/>
    <circle cx="${legX+6}" cy="${legY+4}" r="5"
      fill="rgba(218,165,32,0.18)" stroke="rgba(218,165,32,0.6)" stroke-width="1.5"/>
    <text x="${legX+18}" y="${legY+7}" fill="rgba(218,165,32,0.6)" font-size="7"
      font-family="JetBrains Mono, monospace">N\u0153ud id\u00e9al (ce que l'arbre devrait avoir)</text>
    <line x1="${legX}" y1="${legY+22}" x2="${legX+14}" y2="${legY+22}"
      stroke="rgba(218,165,32,0.45)" stroke-width="1.6"/>
    <text x="${legX+18}" y="${legY+25}" fill="rgba(218,165,32,0.6)" font-size="7"
      font-family="JetBrains Mono, monospace">Connexion structurelle (hi\u00e9rarchie r\u00e9elle)</text>
  `;

  // Footer
  svgHTML += `
    <text x="${CENTER_X}" y="1180" text-anchor="middle" fill="#444" font-size="9"
          font-family="JetBrains Mono, monospace" letter-spacing="3" opacity="0.3">
      WINTER TREE ENGINE v1 — ${(TREE_DATA.idea || "").replace("[scanned] ", "")}
    </text>`;

  svg.innerHTML = svgHTML;

  // Node click + hover events (bidirectional)
  svg.querySelectorAll(".node-g").forEach(g => {
    g.addEventListener("click", (e) => {
      e.stopPropagation();
      selectNode(g.dataset.id);
    });
    g.addEventListener("mouseenter", () => {
      const row = document.querySelector(`.node-row[data-id="${g.dataset.id}"]`);
      if (row) {
        row.classList.add("highlight");
        row.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    });
    g.addEventListener("mouseleave", () => {
      const row = document.querySelector(`.node-row[data-id="${g.dataset.id}"]`);
      if (row) row.classList.remove("highlight");
    });
  });
}

// ── HIGHLIGHT TREE NODE (from sidebar hover) ──
function highlightTreeNode(id, on) {
  const g = document.querySelector(`.node-g[data-id="${id}"]`);
  if (!g) return;
  if (on) g.classList.add("highlight");
  else g.classList.remove("highlight");
}

// ── CONNECTOR LINE (sidebar row → tree node) ──
function updateConnector(id) {
  const svg = document.getElementById("connectorSvg");
  const app = document.querySelector(".app");
  if (!svg || !app) return;
  svg.setAttribute("width", app.clientWidth);
  svg.setAttribute("height", app.clientHeight);
  svg.innerHTML = "";
  if (!id) return;

  const row = document.querySelector(`.node-row[data-id="${id}"]`);
  const nodeG = document.querySelector(`.node-g[data-id="${id}"]`);
  if (!row || !nodeG) return;
  const circle = nodeG.querySelector("circle.node-bg");
  if (!circle) return;

  const rowRect = row.getBoundingClientRect();
  const appRect = app.getBoundingClientRect();
  const rowY = rowRect.top + rowRect.height / 2 - appRect.top;
  const rowX = rowRect.right - appRect.left;

  const cx = parseFloat(circle.getAttribute("cx"));
  const cy = parseFloat(circle.getAttribute("cy"));
  const sidebarW = 300;
  const nodeScreenX = sidebarW + panX + cx * zoom;
  const nodeScreenY = panY + cy * zoom;

  const midX = rowX + (nodeScreenX - rowX) * 0.4;
  svg.innerHTML = `
    <path class="connector-line active"
          d="M${rowX},${rowY} C${midX},${rowY} ${midX},${nodeScreenY} ${nodeScreenX},${nodeScreenY}"
          fill="none"/>
  `;
}

// ── NODE SELECTION ──
function selectNode(id) {
  selectedNodeId = id;
  const node = TREE_DATA.nodes.find(n => n.id === id);
  if (!node) return;

  // Highlight in table
  document.querySelectorAll(".node-row").forEach(i => i.classList.remove("selected"));
  const listItem = document.querySelector(`.node-row[data-id="${id}"]`);
  if (listItem) {
    listItem.classList.add("selected");
    listItem.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  // Highlight in SVG
  document.querySelectorAll(".node-g").forEach(g => g.classList.remove("selected"));
  const svgNode = document.querySelector(`.node-g[data-id="${id}"]`);
  if (svgNode) svgNode.classList.add("selected");

  // Pan to node
  if (svgNode) {
    const circle = svgNode.querySelector("circle.node-bg");
    if (circle) {
      panToPoint(parseFloat(circle.getAttribute("cx")), parseFloat(circle.getAttribute("cy")));
    }
  }

  // Draw connector
  updateConnector(id);

  // Open detail
  showDetail(node);
}

function showDetail(node) {
  const panel = document.getElementById("detailPanel");
  const lk = nodeLevelKey(node);
  const lev = LEVELS[lk] || {};

  document.getElementById("detailId").textContent = `${node.id} · ${lev.label || lk}`;
  document.getElementById("detailLabel").textContent = node.label || "";

  const conf = node.confidence || 0;
  const fill = node.status === "done" ? "var(--green)" :
               node.status === "wip" ? "var(--orange)" : "var(--red)";

  let bodyHTML = `
    <div class="detail-row">
      <span class="dr-label">Status</span>
      <span class="dr-value" style="color:${fill}">${statusIcon(node.status)} ${node.status}</span>
    </div>
    <div class="detail-row">
      <span class="dr-label">Confidence</span>
      <span class="dr-value">${conf}%</span>
    </div>
    <div class="confidence-bar-detail">
      <div class="fill" style="width:${conf}%; background:${fill}"></div>
    </div>
    <div class="detail-row" style="margin-top:8px">
      <span class="dr-label">Niveau</span>
      <span class="dr-value" style="color:${lev.color || '#888'}">${lev.label || lk}</span>
    </div>
    <div class="detail-row">
      <span class="dr-label">Zone</span>
      <span class="dr-value">${lev.zone === "aerial" ? "🌿 Aérien" : "🌍 Souterrain"}</span>
    </div>`;

  if (node.entry && node.entry !== "~") {
    bodyHTML += `
    <div class="detail-row">
      <span class="dr-label">Entry</span>
      <span class="dr-value" style="font-size:9px; opacity:0.7">${node.entry}</span>
    </div>`;
  }

  if (node.depends && node.depends.length > 0) {
    bodyHTML += `
    <div class="detail-row">
      <span class="dr-label">Dépend de</span>
      <span class="dr-value">${node.depends.join(", ")}</span>
    </div>`;
  }

  document.getElementById("detailBody").innerHTML = bodyHTML;
  panel.classList.add("open");
}

function closeDetail() {
  document.getElementById("detailPanel").classList.remove("open");
  selectedNodeId = null;
  document.querySelectorAll(".node-row").forEach(i => i.classList.remove("selected"));
  document.querySelectorAll(".node-g").forEach(g => g.classList.remove("selected"));
  updateConnector(null);
}

// ── PAN / ZOOM ──
function setupCanvasEvents() {
  const canvas = document.getElementById("canvas");

  canvas.addEventListener("mousedown", e => {
    if (e.target.closest(".detail-panel, .zoom-controls, .minimap")) return;
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    panStartX = panX;
    panStartY = panY;
  });

  window.addEventListener("mousemove", e => {
    if (!isDragging) return;
    panX = panStartX + (e.clientX - dragStartX);
    panY = panStartY + (e.clientY - dragStartY);
    applyTransform();
    updateMinimap();
  });

  window.addEventListener("mouseup", () => { isDragging = false; });

  canvas.addEventListener("wheel", e => {
    if (e.target.closest(".node-list")) return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const oldZoom = zoom;
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    zoom = Math.max(0.15, Math.min(3, zoom * delta));

    // Zoom toward cursor
    panX = mx - (mx - panX) * (zoom / oldZoom);
    panY = my - (my - panY) * (zoom / oldZoom);

    applyTransform();
    updateMinimap();
  }, { passive: false });

  // Click on empty canvas = close detail
  canvas.addEventListener("click", e => {
    if (!e.target.closest(".node-g, .detail-panel, .zoom-controls, .minimap, .zoom-btn")) {
      closeDetail();
    }
  });
}

function applyTransform() {
  const inner = document.getElementById("canvasInner");
  inner.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  inner.style.transition = isDragging ? "none" : "transform 0.2s ease-out";
  document.getElementById("zoomLevel").textContent = `${Math.round(zoom * 100)}%`;
  if (selectedNodeId) updateConnector(selectedNodeId);
}

function fitToScreen() {
  const canvas = document.getElementById("canvas");
  const cw = canvas.clientWidth;
  const ch = canvas.clientHeight;
  zoom = Math.min(cw / IMG_W, ch / IMG_H) * 0.92;
  panX = (cw - IMG_W * zoom) / 2;
  panY = (ch - IMG_H * zoom) / 2;
  applyTransform();
  updateMinimap();
}

function panToPoint(x, y) {
  const canvas = document.getElementById("canvas");
  const cw = canvas.clientWidth;
  const ch = canvas.clientHeight;
  panX = cw / 2 - x * zoom;
  panY = ch / 2 - y * zoom;
  applyTransform();
  updateMinimap();
}

function setupZoomControls() {
  document.getElementById("zoomIn").addEventListener("click", () => {
    zoom = Math.min(3, zoom * 1.2);
    applyTransform();
    updateMinimap();
  });
  document.getElementById("zoomOut").addEventListener("click", () => {
    zoom = Math.max(0.15, zoom * 0.8);
    applyTransform();
    updateMinimap();
  });
  document.getElementById("zoomFit").addEventListener("click", fitToScreen);
}

// ── MINIMAP ──
function updateMinimap() {
  const canvas = document.getElementById("canvas");
  const mm = document.getElementById("minimap");
  const vp = document.getElementById("minimapViewport");

  const mmW = mm.clientWidth;
  const mmH = mm.clientHeight;
  const cw = canvas.clientWidth;
  const ch = canvas.clientHeight;

  const scaleX = mmW / (IMG_W * zoom);
  const scaleY = mmH / (IMG_H * zoom);

  const vpW = cw * scaleX;
  const vpH = ch * scaleY;
  const vpX = (-panX / (IMG_W * zoom)) * mmW;
  const vpY = (-panY / (IMG_H * zoom)) * mmH;

  vp.style.width = `${Math.min(vpW, mmW)}px`;
  vp.style.height = `${Math.min(vpH, mmH)}px`;
  vp.style.left = `${Math.max(0, Math.min(vpX, mmW - vpW))}px`;
  vp.style.top = `${Math.max(0, Math.min(vpY, mmH - vpH))}px`;
}

// ── GO ──
init();
</script>
