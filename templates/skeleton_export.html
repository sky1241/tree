function buildSkeleton(family, scale) {
  const skel = _F[family];
  const pw = skel.pw;
  const nr = skel.nr;
  const s = scale || 1;
  const w = IMG_W * s, h = IMG_H * s;

  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${IMG_W} ${IMG_H}" style="background:#050805;">`;

  // Defs
  svg += `<defs>
    <filter id="g${family}" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="ts${family}" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>`;

  // Axe central
  svg += `<line x1="${CENTER_X}" y1="60" x2="${CENTER_X}" y2="1160" stroke="rgba(139,105,20,0.15)" stroke-width="1" stroke-dasharray="6,4"/>`;

  // SOL
  svg += `<line x1="40" y1="${SOL_Y}" x2="882" y2="${SOL_Y}" stroke="#8B6914" stroke-width="2.5" opacity="0.4"/>`;

  // ── BANDES DE NIVEAUX (10 niveaux fixes pour TOUTES les familles) ──
  const AERIAL_TOP = 30;
  const AERIAL_BOT = SOL_Y - 40;
  const UNDER_TOP = SOL_Y + 40;
  const UNDER_BOT = 1090;

  const allAerialLks = ["C", "F", "b", "B", "T"];
  const allUnderLks = ["R-1", "R-2", "R-3", "R-4", "R-5"];

  const aerialBandH = (AERIAL_BOT - AERIAL_TOP) / allAerialLks.length;
  const underBandH = (UNDER_BOT - UNDER_TOP) / allUnderLks.length;

  const bandInfo = {};
  allAerialLks.forEach((lk, i) => {
    const top = AERIAL_TOP + i * aerialBandH;
    bandInfo[lk] = { lineY: top, centerY: top + aerialBandH / 2 };
  });
  allUnderLks.forEach((lk, i) => {
    const top = UNDER_TOP + i * underBandH;
    bandInfo[lk] = { lineY: top, centerY: top + underBandH / 2 };
  });

  // Adjusted node positions: center nodes vertically in their band, keep X
  const iPos = {};
  for (const lk of [...allAerialLks, ...allUnderLks]) {
    const levelNodes = skel.nodes.filter(n => n.lk === lk);
    if (levelNodes.length === 0) continue;
    const origCenterY = levelNodes.reduce((s, n) => s + n.y, 0) / levelNodes.length;
    const dy = bandInfo[lk].centerY - origCenterY;
    levelNodes.forEach(n => {
      iPos[n.id] = { x: n.x, y: Math.round(n.y + dy) };
    });
  }

  // Trunk (from T node to SOL)
  const trunkNode = skel.nodes.find(n => n.lk === "T");
  const trunkY = trunkNode && iPos[trunkNode.id] ? iPos[trunkNode.id].y : null;
  if (skel.trunkTopY !== null && trunkY) {
    // Trunk goes from top of first aerial band to SOL
    const topY = bandInfo[allAerialLks[0]]?.lineY || AERIAL_TOP;
    svg += `<line x1="${CENTER_X}" y1="${Math.round(topY)}" x2="${CENTER_X}" y2="${SOL_Y}" stroke="rgba(255,255,255,0.5)" stroke-width="${pw['T']}"/>`;
  } else if (skel.trunkTopY !== null) {
    svg += `<line x1="${CENTER_X}" y1="${skel.trunkTopY}" x2="${CENTER_X}" y2="${SOL_Y}" stroke="rgba(255,255,255,0.5)" stroke-width="${pw['T']}"/>`;
  } else {
    // Pas de tronc (buisson): uniquement tiges→sol (pas de tige centrale en haut)
    const bNodes = skel.nodes.filter(n => n.lk === "B");
    if (bNodes.length) {
      const bCenterY = bNodes.reduce((s, n) => s + (iPos[n.id]?.y || n.y), 0) / bNodes.length;
      svg += `<line x1="${CENTER_X}" y1="${Math.round(bCenterY)}" x2="${CENTER_X}" y2="${SOL_Y}" stroke="rgba(255,255,255,0.4)" stroke-width="${pw['B'] * 0.6}"/>`;
    }
  }
  svg += `<line x1="${CENTER_X}" y1="${SOL_Y}" x2="${CENTER_X}" y2="${Math.round(UNDER_TOP + 5)}" stroke="rgba(255,255,255,0.35)" stroke-width="${(pw['T'] || 2) * 0.85}"/>`;

  // Connections (using adjusted positions)
  skel.nodes.forEach(n => {
    const pos = iPos[n.id];
    if (!pos || n.lk === "T") return;
    let pp;
    if (n.pid && iPos[n.pid]) { pp = iPos[n.pid]; }
    else if (n.lk === "R-1") { pp = { x: CENTER_X, y: SOL_Y + 15 }; }
    else { pp = { x: CENTER_X, y: pos.y - 15 }; }
    const cx = pp.x + (pos.x - pp.x) * 0.55;
    const cy = pp.y + (pos.y - pp.y) * 0.3;
    const sw = pw[n.lk] || 1.0;
    svg += `<path d="M${pp.x},${pp.y} Q${cx},${cy} ${pos.x},${pos.y}" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="${sw}"/>`;
  });

  // Nodes (using adjusted positions)
  skel.nodes.forEach(n => {
    const pos = iPos[n.id];
    if (!pos) return;
    const r = nr[n.lk] || 5;
    const lev = LEVELS[n.lk];
    const above = lev?.zone === "aerial";
    const ly = above ? pos.y - r - 5 : pos.y + r + 13;

    svg += `<circle cx="${pos.x}" cy="${pos.y}" r="${r}" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" filter="url(#g${family})"/>`;
    svg += `<circle cx="${pos.x}" cy="${pos.y}" r="${Math.max(1.5, r * 0.25)}" fill="#fff"/>`;
    svg += `<text x="${pos.x}" y="${ly}" fill="rgba(255,255,255,0.8)" font-size="8" font-family="JetBrains Mono, monospace" text-anchor="middle" font-weight="400" filter="url(#ts${family})">${n.label}</text>`;
  });

  // Draw ALL 10 level lines + bottom boundaries — EN DERNIER (par-dessus tout)
  const lineColor = "rgba(255,255,255,0.35)";
  for (const lk of [...allAerialLks, ...allUnderLks]) {
    const bi = bandInfo[lk];
    if (!bi) continue;
    svg += `<line x1="40" y1="${Math.round(bi.lineY)}" x2="882" y2="${Math.round(bi.lineY)}" stroke="${lineColor}" stroke-width="0.8" stroke-dasharray="4,6"/>`;
  }
  svg += `<line x1="40" y1="${Math.round(AERIAL_BOT)}" x2="882" y2="${Math.round(AERIAL_BOT)}" stroke="${lineColor}" stroke-width="0.8" stroke-dasharray="4,6"/>`;
  svg += `<line x1="40" y1="${Math.round(UNDER_BOT)}" x2="882" y2="${Math.round(UNDER_BOT)}" stroke="${lineColor}" stroke-width="0.8" stroke-dasharray="4,6"/>`;

  svg += `</svg>`;
  return svg;
}

// Build grid
const grid = document.getElementById("grid");
const families = ["conifere", "feuillu", "baobab", "palmier", "buisson", "liane"];

families.forEach(f => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h2>${_F[f].emoji} ${_F[f].fullName}</h2>${buildSkeleton(f, 0.35)}`;
  card.onclick = () => openSolo(f);
  grid.appendChild(card);
});

function openSolo(f) {
  document.getElementById("soloTitle").textContent = `${_F[f].emoji} ${_F[f].fullName}`;
  document.getElementById("soloSvg").innerHTML = buildSkeleton(f, 0.85);
  document.getElementById("solo").classList.add("active");
  document.getElementById("backBtn").classList.add("active");
}
function closeSolo() {
  document.getElementById("solo").classList.remove("active");
  document.getElementById("backBtn").classList.remove("active");
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSolo(); });
</script>
</body>
</html>
