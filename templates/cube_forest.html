<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winter Tree — Le Cube</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap');

  :root {
    --bg: #050805;
    --bg2: #0a0d08;
    --gold: #8B6914;
    --gold-light: #c4a035;
    --text: #EDE5DB;
    --text-dim: rgba(237,229,219,0.4);
    --green: #28c862;
    --orange: #FFB74D;
    --red: #FF5252;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #canvas3d {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
  }

  /* ── TOOLTIP HOVER ── */
  #tooltip {
    position: fixed;
    z-index: 100;
    background: rgba(10,13,8,0.95);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 12px;
    pointer-events: none;
    display: none;
    max-width: 280px;
    backdrop-filter: blur(8px);
  }
  #tooltip .tt-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--gold-light);
    margin-bottom: 4px;
  }
  #tooltip .tt-family {
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  #tooltip .tt-stats {
    display: flex;
    gap: 12px;
    font-size: 11px;
    color: var(--text);
  }
  #tooltip .tt-stats span { opacity: 0.7; }

  /* ── DETAIL PANEL (right slide) ── */
  #detail {
    position: fixed;
    top: 0; right: 0;
    width: 380px;
    height: 100vh;
    background: rgba(10,13,8,0.97);
    border-left: 1px solid var(--gold);
    z-index: 50;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    overflow-y: auto;
    padding: 24px;
    backdrop-filter: blur(12px);
  }
  #detail.open { transform: translateX(0); }

  #detail .close-btn {
    position: absolute;
    top: 12px; right: 12px;
    background: none;
    border: 1px solid var(--text-dim);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  #detail .close-btn:hover { border-color: var(--gold); }

  #detail h2 {
    font-size: 18px;
    color: var(--gold-light);
    margin-bottom: 4px;
    padding-right: 50px;
  }
  #detail .d-family {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  #detail .d-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }
  #detail .d-stat {
    background: rgba(139,105,20,0.1);
    border: 1px solid rgba(139,105,20,0.2);
    border-radius: 4px;
    padding: 8px;
    font-size: 11px;
  }
  #detail .d-stat .val {
    font-size: 16px;
    font-weight: 600;
    color: var(--gold-light);
  }
  #detail .d-stat .lbl {
    color: var(--text-dim);
    font-size: 10px;
  }

  /* Nodes by level */
  #detail .level-section {
    margin-bottom: 12px;
  }
  #detail .level-header {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 3px;
    margin-bottom: 4px;
  }
  .level-aerial { background: rgba(40,200,98,0.15); color: var(--green); }
  .level-sol { background: rgba(139,105,20,0.3); color: var(--gold-light); }
  .level-under { background: rgba(154,116,83,0.2); color: #9a7453; }

  #detail .node-item {
    font-size: 11px;
    padding: 4px 8px 4px 16px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-done { background: var(--green); }
  .status-wip { background: var(--orange); }
  .status-todo { background: var(--red); }

  /* ── HEADER HUD ── */
  #hud {
    position: fixed;
    top: 16px; left: 16px;
    z-index: 10;
    font-size: 13px;
  }
  #hud h1 {
    font-size: 16px;
    font-weight: 600;
    color: var(--gold-light);
  }
  #hud .sub {
    font-size: 11px;
    color: var(--text-dim);
  }

  /* ── INSTRUCTIONS ── */
  #instructions {
    position: fixed;
    bottom: 16px; left: 16px;
    z-index: 10;
    font-size: 10px;
    color: var(--text-dim);
  }
</style>
</head>
<body>

<canvas id="canvas3d"></canvas>

<div id="hud">
  <h1>WINTER TREE</h1>
  <div class="sub" id="hud-count"></div>
</div>

<div id="tooltip">
  <div class="tt-name"></div>
  <div class="tt-family"></div>
  <div class="tt-stats"></div>
</div>

<div id="detail">
  <button class="close-btn" onclick="closeDetail()">ESC</button>
  <h2 id="d-name"></h2>
  <div class="d-family" id="d-family"></div>
  <div class="d-stats" id="d-stats"></div>
  <div id="d-nodes"></div>
</div>

<div id="instructions">
  Clic gauche + glisser = tourner &nbsp;|&nbsp; Molette = zoom &nbsp;|&nbsp; Hover = info &nbsp;|&nbsp; Clic = profil &nbsp;|&nbsp; ESC = fermer
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── FAMILY COLORS ──
const FAMILY_COLORS = {
  conifere: 0x2d8a4e,
  feuillu:  0x5a9a35,
  palmier:  0x7ab648,
  baobab:   0x8a6344,
  buisson:  0x3d8a3a,
  liane:    0x6b8a5a,
};
const FAMILY_SHAPES = {
  conifere: 'cone',
  feuillu:  'sphere',
  palmier:  'tall',
  baobab:   'wide',
  buisson:  'low',
  liane:    'flat',
};

// ── SCENE SETUP ──
const canvas = document.getElementById('canvas3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x050805, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050805, 0.012);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(25, 20, 25);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 8;
controls.maxDistance = 80;
controls.target.set(0, 2, 0);

// ── LIGHTS ──
const ambientLight = new THREE.AmbientLight(0x1a2a1a, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xc4a035, 0.8);
dirLight.position.set(20, 30, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 1;
dirLight.shadow.camera.far = 100;
dirLight.shadow.camera.left = -30;
dirLight.shadow.camera.right = 30;
dirLight.shadow.camera.top = 30;
dirLight.shadow.camera.bottom = -30;
scene.add(dirLight);

const pointLight = new THREE.PointLight(0x28c862, 0.3, 60);
pointLight.position.set(-10, 15, -10);
scene.add(pointLight);

// ── GROUND PLATE ──
const groundGeo = new THREE.PlaneGeometry(60, 60);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x0a0d08,
  roughness: 0.9,
  metalness: 0.1,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Grid
const gridHelper = new THREE.GridHelper(60, 30, 0x1a2a1a, 0x0f150f);
gridHelper.position.y = 0.01;
scene.add(gridHelper);

// Soil line glow
const soilGeo = new THREE.PlaneGeometry(60, 0.05);
const soilMat = new THREE.MeshBasicMaterial({ color: 0x8B6914, transparent: true, opacity: 0.4 });
const soilLine = new THREE.Mesh(soilGeo, soilMat);
soilLine.rotation.x = -Math.PI / 2;
soilLine.position.y = 0.02;
scene.add(soilLine);

// ── FETCH TREES AND BUILD ──
const treeMeshes = []; // { mesh, data }
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredTree = null;

async function loadForest() {
  const resp = await fetch('/api/trees');
  const json = await resp.json();
  const trees = json.trees;

  document.getElementById('hud-count').textContent = `${trees.length} arbres dans la foret`;

  // Layout: spiral placement
  const count = trees.length;
  trees.sort((a, b) => (b.scale?.lines || 0) - (a.scale?.lines || 0));

  trees.forEach((t, i) => {
    const angle = i * 2.4; // golden angle
    const radius = 4 + Math.sqrt(i) * 3.5;
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;

    const group = createTree3D(t, x, z);
    scene.add(group);
    treeMeshes.push({ mesh: group, data: t });
  });
}

function createTree3D(treeData, x, z) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  group.userData = treeData;

  const family = treeData.family || 'feuillu';
  const color = FAMILY_COLORS[family] || 0x5a9a35;
  const scale = treeData.scale || {};
  const lines = scale.lines || 100;
  const factor = scale.factor || 1;

  // Height: log scale, min 1, max 12
  const height = Math.max(1, Math.min(12, Math.log10(Math.max(lines, 10)) * 2.5));
  const trunkWidth = Math.max(0.15, Math.min(0.8, (scale.trunk_width || 1) * 0.3));

  // Trunk
  const trunkGeo = new THREE.CylinderGeometry(trunkWidth * 0.6, trunkWidth, height * 0.6, 8);
  const trunkMat = new THREE.MeshStandardMaterial({
    color: 0x5c3317,
    roughness: 0.85,
    metalness: 0.05,
  });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = height * 0.3;
  trunk.castShadow = true;
  group.add(trunk);

  // Crown based on family
  const crownMat = new THREE.MeshStandardMaterial({
    color: color,
    roughness: 0.7,
    metalness: 0.05,
    transparent: true,
    opacity: 0.85,
  });

  let crown;
  const shape = FAMILY_SHAPES[family] || 'sphere';

  if (shape === 'cone') {
    // Conifere: tall cone
    const cGeo = new THREE.ConeGeometry(height * 0.3, height * 0.7, 8);
    crown = new THREE.Mesh(cGeo, crownMat);
    crown.position.y = height * 0.65 + height * 0.35;
  } else if (shape === 'sphere') {
    // Feuillu: round canopy
    const sGeo = new THREE.SphereGeometry(height * 0.35, 12, 10);
    crown = new THREE.Mesh(sGeo, crownMat);
    crown.position.y = height * 0.6 + height * 0.25;
  } else if (shape === 'wide') {
    // Baobab: massive trunk, small crown
    trunk.scale.x = 2.5;
    trunk.scale.z = 2.5;
    const sGeo = new THREE.SphereGeometry(height * 0.25, 10, 8);
    crown = new THREE.Mesh(sGeo, crownMat);
    crown.position.y = height * 0.6 + height * 0.15;
  } else if (shape === 'tall') {
    // Palmier: tall thin + crown at top
    trunk.scale.x = 0.5;
    trunk.scale.z = 0.5;
    const sGeo = new THREE.SphereGeometry(height * 0.3, 10, 8);
    sGeo.scale(1.5, 0.6, 1.5);
    crown = new THREE.Mesh(sGeo, crownMat);
    crown.position.y = height * 0.6 + height * 0.1;
  } else if (shape === 'low') {
    // Buisson: low, wide
    const sGeo = new THREE.SphereGeometry(height * 0.4, 10, 8);
    sGeo.scale(1.5, 0.6, 1.5);
    crown = new THREE.Mesh(sGeo, crownMat);
    crown.position.y = height * 0.3;
    trunk.scale.y = 0.3;
    trunk.position.y = height * 0.1;
  } else {
    // Liane: flat, sprawling
    const sGeo = new THREE.SphereGeometry(height * 0.3, 10, 8);
    sGeo.scale(2, 0.4, 1);
    crown = new THREE.Mesh(sGeo, crownMat);
    crown.position.y = height * 0.4;
  }

  crown.castShadow = true;
  group.add(crown);

  // Roots (simple lines going down)
  const rootCount = Math.min(5, Math.max(2, Math.floor(lines / 5000)));
  const rootMat = new THREE.MeshBasicMaterial({ color: 0x5c3317, transparent: true, opacity: 0.4 });
  for (let r = 0; r < rootCount; r++) {
    const angle = (r / rootCount) * Math.PI * 2;
    const rLen = height * 0.3 + Math.random() * height * 0.2;
    const rGeo = new THREE.CylinderGeometry(0.03, 0.06, rLen, 4);
    const root = new THREE.Mesh(rGeo, rootMat);
    root.position.set(
      Math.cos(angle) * trunkWidth * 0.8,
      -rLen / 2,
      Math.sin(angle) * trunkWidth * 0.8
    );
    root.rotation.x = Math.random() * 0.3 - 0.15;
    root.rotation.z = Math.cos(angle) * 0.4;
    group.add(root);
  }

  // Health glow at base
  const nodesDone = treeData.done || 0;
  const nodesTotal = treeData.nodes_count || 1;
  const health = nodesTotal > 0 ? nodesDone / nodesTotal : 0;
  const glowColor = health > 0.7 ? 0x28c862 : health > 0.3 ? 0xFFB74D : 0xFF5252;
  const glowGeo = new THREE.RingGeometry(trunkWidth * 1.5, trunkWidth * 2.5, 16);
  const glowMat = new THREE.MeshBasicMaterial({
    color: glowColor,
    transparent: true,
    opacity: 0.25,
    side: THREE.DoubleSide,
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.rotation.x = -Math.PI / 2;
  glow.position.y = 0.03;
  group.add(glow);

  return group;
}

// ── INTERACTION ──
const tooltip = document.getElementById('tooltip');

function onMouseMove(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const meshes = treeMeshes.map(t => t.mesh.children).flat();
  const intersects = raycaster.intersectObjects(meshes, false);

  if (intersects.length > 0) {
    const hit = intersects[0].object;
    // Find parent group
    let group = hit.parent;
    const td = treeMeshes.find(t => t.mesh === group);

    if (td) {
      hoveredTree = td;
      canvas.style.cursor = 'pointer';

      const d = td.data;
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 16) + 'px';
      tooltip.style.top = (e.clientY - 10) + 'px';
      tooltip.querySelector('.tt-name').textContent = d.name;
      tooltip.querySelector('.tt-family').textContent = `${d.family_emoji} ${d.family_name} — ${d.scale?.category || ''}`;

      const stats = d.stats || {};
      const langs = Object.keys(stats.languages || {}).slice(0, 3).join(', ') || '?';
      tooltip.querySelector('.tt-stats').innerHTML =
        `<div><span>Lignes</span><br>${(d.scale?.lines || 0).toLocaleString()}</div>` +
        `<div><span>Fichiers</span><br>${stats.total_files || '?'}</div>` +
        `<div><span>Stack</span><br>${langs}</div>`;
    }
  } else {
    hoveredTree = null;
    canvas.style.cursor = 'grab';
    tooltip.style.display = 'none';
  }
}

function onClick(e) {
  if (hoveredTree) {
    showDetail(hoveredTree.data);
  }
}

function showDetail(treeData) {
  const panel = document.getElementById('detail');
  document.getElementById('d-name').textContent = treeData.name;
  document.getElementById('d-family').textContent =
    `${treeData.family_emoji} ${treeData.family_name} — ${treeData.scale?.category || ''}`;

  const stats = treeData.stats || {};
  const scale = treeData.scale || {};
  document.getElementById('d-stats').innerHTML = `
    <div class="d-stat"><div class="val">${(scale.lines || 0).toLocaleString()}</div><div class="lbl">lignes</div></div>
    <div class="d-stat"><div class="val">${stats.total_files || '?'}</div><div class="lbl">fichiers</div></div>
    <div class="d-stat"><div class="val">${(scale.data_mb || 0).toFixed(1)} Mo</div><div class="lbl">data</div></div>
    <div class="d-stat"><div class="val">${treeData.nodes_count || 0}</div><div class="lbl">noeuds</div></div>
  `;

  // Fetch full tree for nodes
  fetch(`/api/tree/${treeData.file}`)
    .then(r => r.json())
    .then(fullTree => {
      renderNodes(fullTree);
    });

  panel.classList.add('open');
}

function renderNodes(tree) {
  const container = document.getElementById('d-nodes');
  container.innerHTML = '';

  const levelDefs = [
    { key: '+5', label: 'Cime — Tests/CI', cls: 'level-aerial', filter: n => n.level === 'C' },
    { key: '+4', label: 'Feuilles — UI/Outputs', cls: 'level-aerial', filter: n => n.level === 'F' },
    { key: '+3', label: 'Rameaux — Sous-features', cls: 'level-aerial', filter: n => n.level === 'b' },
    { key: '+2', label: 'Branches — Modules', cls: 'level-aerial', filter: n => n.level === 'B' },
    { key: '+1', label: 'Tronc — Core', cls: 'level-aerial', filter: n => n.level === 'T' },
    { key: '0', label: '--- SOL ---', cls: 'level-sol', filter: () => false },
    { key: '-1', label: 'Racines structurelles', cls: 'level-under', filter: n => n.level === 'R' && (!n.depth || n.depth === -1) },
    { key: '-2', label: 'Racines pivotantes', cls: 'level-under', filter: n => n.level === 'R' && n.depth === -2 },
    { key: '-3', label: 'Radicelles — Business', cls: 'level-under', filter: n => n.level === 'R' && n.depth === -3 },
    { key: '-4', label: 'Poils — Legal', cls: 'level-under', filter: n => n.level === 'R' && n.depth === -4 },
    { key: '-5', label: 'Mycorhizes — Physique', cls: 'level-under', filter: n => n.level === 'R' && n.depth === -5 },
  ];

  const nodes = tree.nodes || [];

  for (const ld of levelDefs) {
    const filtered = nodes.filter(ld.filter);
    const section = document.createElement('div');
    section.className = 'level-section';

    const header = document.createElement('div');
    header.className = `level-header ${ld.cls}`;
    header.textContent = `[${ld.key}] ${ld.label}`;
    section.appendChild(header);

    if (filtered.length > 0) {
      for (const n of filtered) {
        const item = document.createElement('div');
        item.className = 'node-item';
        const dot = document.createElement('span');
        dot.className = `status-dot status-${n.status || 'todo'}`;
        item.appendChild(dot);
        const text = document.createElement('span');
        text.textContent = `${n.id} — ${n.label}`;
        item.appendChild(text);
        section.appendChild(item);
      }
    }

    container.appendChild(section);
  }
}

function closeDetail() {
  document.getElementById('detail').classList.remove('open');
}

// ESC key
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDetail();
});

canvas.addEventListener('mousemove', onMouseMove);
canvas.addEventListener('click', onClick);

// ── RESIZE ──
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── ANIMATE ──
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// ── GO ──
loadForest().then(() => {
  animate();
});
</script>
</body>
</html>
