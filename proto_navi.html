<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winter Tree — Navi Guide</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a0f;
  overflow: hidden;
  font-family: 'Rajdhani', sans-serif;
  cursor: crosshair;
}

#canvas-container {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

#tree-canvas {
  max-height: 100vh;
  max-width: 100vw;
  object-fit: contain;
}

.node-hitbox {
  position: absolute;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  transform: translate(-50%, -50%);
  z-index: 10;
  transition: all 0.2s ease;
}

.node-hitbox::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 1px solid rgba(0, 220, 255, 0);
  transition: all 0.3s ease;
}

.node-hitbox:hover::before {
  border-color: rgba(0, 220, 255, 0.6);
  box-shadow: 0 0 15px rgba(0, 220, 255, 0.3);
  animation: pulse-ring 1.5s ease infinite;
}

.node-hitbox:hover {
  transform: translate(-50%, -50%) scale(1.3);
}

.node-hitbox.active {
  transform: translate(-50%, -50%) scale(1.5);
}

.node-hitbox.active::before {
  border-color: rgba(0, 220, 255, 0.9);
  box-shadow: 0 0 25px rgba(0, 220, 255, 0.5);
}

@keyframes pulse-ring {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0.4; }
}

/* ══════ HOLOGRAM PANEL ══════ */
#holo-panel {
  position: fixed;
  top: 50%;
  right: 30px;
  transform: translateY(-50%) scaleY(0);
  width: 420px;
  max-height: 80vh;
  z-index: 100;
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
}

#holo-panel.visible {
  transform: translateY(-50%) scaleY(1);
  opacity: 1;
  pointer-events: all;
}

.panel-frame {
  position: relative;
  background: rgba(0, 8, 20, 0.85);
  border: 1px solid rgba(0, 180, 255, 0.3);
  border-radius: 4px;
  padding: 30px 25px;
  backdrop-filter: blur(20px);
  overflow: hidden;
}

.panel-frame::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, #00dcff, #00dcff, transparent);
  animation: scan-line 3s linear infinite;
}

.panel-frame::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, #00dcff88, transparent);
}

@keyframes scan-line {
  0% { opacity: 0.3; }
  50% { opacity: 1; }
  100% { opacity: 0.3; }
}

/* Corner accents */
.corner { position: absolute; width: 20px; height: 20px; }
.corner-tl { top: -1px; left: -1px; border-top: 2px solid #00dcff; border-left: 2px solid #00dcff; }
.corner-tr { top: -1px; right: -1px; border-top: 2px solid #00dcff; border-right: 2px solid #00dcff; }
.corner-bl { bottom: -1px; left: -1px; border-bottom: 2px solid #00dcff; border-left: 2px solid #00dcff; }
.corner-br { bottom: -1px; right: -1px; border-bottom: 2px solid #00dcff; border-right: 2px solid #00dcff; }

/* Navi fairy */
#navi {
  position: absolute;
  top: -20px;
  left: 20px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: radial-gradient(circle, #00ffcc, #00aaff, transparent);
  animation: navi-float 2s ease-in-out infinite, navi-glow 1.5s ease infinite;
  z-index: 101;
}

@keyframes navi-float {
  0%, 100% { transform: translateY(0px) scale(1); }
  50% { transform: translateY(-8px) scale(1.1); }
}

@keyframes navi-glow {
  0%, 100% { box-shadow: 0 0 15px #00ffcc, 0 0 30px #00aaff44; }
  50% { box-shadow: 0 0 25px #00ffcc, 0 0 50px #00aaff66; }
}

.navi-text {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  color: #00ffcc;
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-bottom: 15px;
  text-shadow: 0 0 10px #00ffcc;
  opacity: 0.8;
}

.node-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 22px;
  font-weight: 900;
  color: #00dcff;
  text-shadow: 0 0 20px rgba(0, 220, 255, 0.6);
  margin-bottom: 5px;
}

.node-layer {
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  color: #00dcff88;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 20px;
  padding-bottom: 15px;
  border-bottom: 1px solid rgba(0, 220, 255, 0.15);
}

.section-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  color: #00ffcc;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 8px;
  text-shadow: 0 0 8px #00ffcc66;
}

.section-text {
  font-family: 'Rajdhani', sans-serif;
  font-size: 15px;
  font-weight: 400;
  color: rgba(200, 240, 255, 0.9);
  line-height: 1.6;
  margin-bottom: 20px;
}

.ask-ai-box {
  background: rgba(0, 220, 255, 0.05);
  border: 1px solid rgba(0, 220, 255, 0.2);
  border-radius: 3px;
  padding: 12px 15px;
  margin-bottom: 10px;
}

.ask-ai-box .prompt {
  font-family: 'Rajdhani', sans-serif;
  font-size: 14px;
  color: #00dcff;
  font-style: italic;
  line-height: 1.5;
}

.ask-ai-box .prompt::before {
  content: '💬 ';
}

.status-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 15px;
  padding-top: 15px;
  border-top: 1px solid rgba(0, 220, 255, 0.15);
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff4444;
  box-shadow: 0 0 8px #ff444488;
}

.status-dot.done { background: #00ff88; box-shadow: 0 0 8px #00ff8888; }
.status-dot.wip { background: #ffaa00; box-shadow: 0 0 8px #ffaa0088; }

.status-text {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  color: #00dcff88;
  letter-spacing: 2px;
}

#close-btn {
  position: absolute;
  top: 10px;
  right: 12px;
  background: none;
  border: 1px solid rgba(0, 220, 255, 0.3);
  color: #00dcff;
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  padding: 3px 8px;
  cursor: pointer;
  z-index: 102;
  transition: all 0.2s;
}

#close-btn:hover {
  background: rgba(0, 220, 255, 0.15);
  border-color: #00dcff;
}

/* Scanline overlay */
.scanlines {
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, 0.03) 2px,
    rgba(0, 0, 0, 0.03) 4px
  );
  pointer-events: none;
  z-index: 200;
}

/* Flicker on appear */
#holo-panel.visible .panel-frame {
  animation: holo-flicker 0.3s ease;
}

@keyframes holo-flicker {
  0% { opacity: 0; }
  20% { opacity: 0.8; }
  40% { opacity: 0.3; }
  60% { opacity: 0.9; }
  80% { opacity: 0.6; }
  100% { opacity: 1; }
}
</style>
</head>
<body>

<div id="canvas-container">
  <canvas id="tree-canvas"></canvas>
</div>

<!-- HOLOGRAM PANEL -->
<div id="holo-panel">
  <div id="navi"></div>
  <div class="panel-frame">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <button id="close-btn">✕ ESC</button>
    
    <div class="navi-text">◈ Hey! Écoute! ◈</div>
    <div class="node-name" id="panel-name"></div>
    <div class="node-layer" id="panel-layer"></div>
    
    <div class="section-title">◇ C'est quoi ?</div>
    <div class="section-text" id="panel-desc"></div>
    
    <div class="section-title">◇ Ce que tu dois faire</div>
    <div class="section-text" id="panel-task"></div>
    
    <div class="section-title">◇ Demande à l'IA</div>
    <div id="panel-prompts"></div>
    
    <div class="status-bar">
      <div class="status-dot" id="panel-dot"></div>
      <div class="status-text" id="panel-status">TODO</div>
    </div>
  </div>
</div>

<div class="scanlines"></div>

<script>
// ══════ NODE DATA ══════
const LAYER_INFO = {
  'T': {
    fullName: 'CIME — La Vision',
    color: '#5a9a35',
    desc: "C'est le sommet de ton projet. La cime de l'arbre. C'est là que tu définis CE QUE ton app fait, en une phrase. Si tu peux pas l'expliquer en une phrase, c'est que c'est pas encore clair dans ta tête.",
    task: "Écris une phrase qui résume ton projet. Genre: 'Une app qui affiche mes repos GitHub comme un arbre qui pousse.' C'est ta boussole. Tout le reste découle de là.",
    prompts: [
      "Aide-moi à résumer mon projet en une phrase claire",
      "Quel est l'objectif principal de mon application ?",
      "Explique-moi la vision de mon projet comme si j'avais 10 ans"
    ]
  },
  'B': {
    fullName: 'BRANCHES — Les Grosses Features',
    color: '#3d8a3a',
    desc: "Les branches, c'est les GROS morceaux de ton projet. Les features principales. Chaque branche = une chose importante que ton app sait faire. T'en as pas 50, t'en as 3 ou 4 max.",
    task: "Liste les 3-4 trucs les plus importants que ton app doit faire. Pas les détails, les GROS trucs. Genre: '1. Lire les repos GitHub 2. Afficher un arbre 3. Tracker la progression'.",
    prompts: [
      "Quelles sont les 3 features principales de mon projet ?",
      "Aide-moi à découper mon projet en gros blocs fonctionnels",
      "C'est quoi le MVP minimum de mon app ?"
    ]
  },
  'b': {
    fullName: 'RAMEAUX — Les Sous-Features',
    color: '#389060',
    desc: "Les rameaux, c'est quand tu prends une grosse branche et tu la découpes en morceaux plus petits. C'est là que ça commence à devenir concret. Chaque rameau c'est une tâche que tu peux faire en une session.",
    task: "Prends chaque grosse feature et découpe-la en 2-3 sous-tâches. Genre: 'Afficher un arbre' → 'charger l'image', 'placer les nœuds', 'dessiner les câbles'. Des trucs faisables en une après-midi.",
    prompts: [
      "Découpe cette feature en sous-tâches concrètes",
      "Quels sont les étapes pour implémenter [feature] ?",
      "Par quoi je commence pour coder cette partie ?"
    ]
  },
  'F': {
    fullName: 'FEUILLES — Le Code',
    color: '#32b555',
    desc: "Les feuilles, c'est là où le code vit. Chaque feuille = un fichier, une fonction, un composant. C'est le niveau où tu ouvres ton éditeur et tu tapes. C'est ici que toi et l'IA vous bossez ensemble.",
    task: "C'est le moment de coder. Ouvre ton éditeur, décris à l'IA ce que tu veux, et laisse-la t'aider. Teste, corrige, avance. Chaque feuille finie = un bout de vert sur ton arbre.",
    prompts: [
      "Écris-moi le code pour [fonction spécifique]",
      "J'ai cette erreur, aide-moi à comprendre et corriger",
      "Comment je structure ce fichier pour faire [chose] ?"
    ]
  },
  'C': {
    fullName: 'CŒUR — Le Tronc',
    color: '#28c862',
    desc: "Le cœur, c'est le tronc de ton arbre. C'est le fichier principal, le point d'entrée, le truc qui tient TOUT ensemble. Sans le tronc, rien ne tient debout. C'est ton main.dart, ton app.py, ton index.js.",
    task: "Assure-toi que ton point d'entrée est propre. C'est le premier fichier que quelqu'un ouvre. Il doit être clair, bien structuré, et dire 'voilà ce que ce projet fait'. Tout part de là, tout revient à là.",
    prompts: [
      "Structure-moi le fichier principal de mon projet",
      "Comment organiser mes imports et mes routes ?",
      "Fais-moi un squelette propre pour démarrer mon app"
    ]
  },
  'R-1': {
    fullName: 'RACINE 1 — Setup & Config',
    color: '#9a7453',
    desc: "La première couche de racines. C'est le setup: installer les dépendances, configurer l'environnement, créer le repo Git. C'est pas sexy mais sans ça, RIEN ne pousse au-dessus.",
    task: "Crée ton repo, installe tes packages, configure ton linter. Fais en sorte que quand tu tapes 'run', ça démarre. Même si ça affiche rien de beau, le moteur doit tourner.",
    prompts: [
      "Crée-moi le setup complet pour un projet [Flutter/Python/etc]",
      "Quelles dépendances j'ai besoin pour faire [chose] ?",
      "Configure-moi le pubspec.yaml / requirements.txt / package.json"
    ]
  },
  'R-2': {
    fullName: 'RACINE 2 — Données & Modèles',
    color: '#8a6344',
    desc: "Deuxième couche. C'est là que tu définis tes données. Quels objets ton app manipule ? Un User ? Un Repo ? Un Node ? C'est les classes, les modèles, les schémas. Le squelette invisible de ton app.",
    task: "Dessine tes modèles de données. Même sur papier. Un User a un nom, un email. Un Repo a un nom, des commits. Ensuite demande à l'IA de te les coder proprement.",
    prompts: [
      "Crée-moi les modèles de données pour mon app",
      "Comment je structure ma classe [Chose] en [langage] ?",
      "Fais-moi un schéma JSON pour représenter [données]"
    ]
  },
  'R-3': {
    fullName: 'RACINE 3 — API & Services',
    color: '#7a5235',
    desc: "Troisième couche. Ton app parle au monde extérieur ici. API GitHub, base de données, fichiers locaux — c'est la plomberie qui connecte tes données au monde réel.",
    task: "Connecte ton app à ses sources de données. Un appel API, une lecture de fichier, une requête en base. Teste que les données arrivent. Même brutes, même moches, tant que ça arrive.",
    prompts: [
      "Comment je fais un appel API à [service] ?",
      "Écris-moi le service qui récupère les données de [source]",
      "Comment je gère les erreurs réseau proprement ?"
    ]
  },
  'R-4': {
    fullName: 'RACINE 4 — Tests & Validation',
    color: '#6b4226',
    desc: "Quatrième couche. C'est là que tu vérifies que rien est cassé. Pas besoin de tests unitaires compliqués — juste vérifier que quand tu appuies sur un bouton, le bon truc se passe.",
    task: "Teste chaque feature à la main. Clique partout, essaie de casser ton app. Note ce qui marche pas. C'est ton QA perso. Si t'es motivé, écris un ou deux tests automatiques sur les trucs critiques.",
    prompts: [
      "Comment j'écris un test simple pour [fonction] ?",
      "Mon app crash quand je fais [action], aide-moi à debug",
      "Quels sont les cas limites que j'ai oublié ?"
    ]
  },
  'R-5': {
    fullName: 'RACINE 5 — Déploiement & Partage',
    color: '#5c3317',
    desc: "La couche la plus profonde. Ton app est prête, faut la mettre au monde. Build, deploy, partager le lien. C'est le moment où ton arbre sort de terre et les autres peuvent le voir.",
    task: "Build ton app. Pousse sur GitHub. Si c'est une app web, déploie sur Vercel ou Netlify. Si c'est mobile, fais un APK. Partage le lien. Ton arbre est vivant.",
    prompts: [
      "Comment je build et déploie mon app [type] ?",
      "Aide-moi à configurer le CI/CD sur GitHub Actions",
      "Comment je fais un APK / une release de mon app ?"
    ]
  }
};

const NODES = [
  {id:"T22",lk:"T",x:432,y:144}, {id:"T23",lk:"T",x:592,y:144},
  {id:"B20",lk:"B",x:299,y:257}, {id:"B21",lk:"B",x:674,y:254},
  {id:"b17",lk:"b",x:336,y:370}, {id:"b18",lk:"b",x:601,y:359}, {id:"b19",lk:"b",x:739,y:404},
  {id:"F13",lk:"F",x:412,y:484}, {id:"F14",lk:"F",x:595,y:484}, {id:"F15",lk:"F",x:674,y:563},
  {id:"C12",lk:"C",x:513,y:743},
  {id:"R-11",lk:"R-1",x:336,y:957}, {id:"R-12",lk:"R-1",x:618,y:960}, {id:"R-13",lk:"R-1",x:703,y:997},
  {id:"R-24",lk:"R-2",x:316,y:1056}, {id:"R-25",lk:"R-2",x:762,y:1062},
  {id:"R-36",lk:"R-3",x:189,y:1121}, {id:"R-37",lk:"R-3",x:945,y:1127}, {id:"R-38",lk:"R-3",x:785,y:1130},
  {id:"R-48",lk:"R-4",x:293,y:1206}, {id:"R-49",lk:"R-4",x:731,y:1208},
  {id:"R-510",lk:"R-5",x:352,y:1347}, {id:"R-511",lk:"R-5",x:683,y:1333}
];

const CONNECTIONS = [
  ["C12","T22"],["C12","T23"],["C12","F13"],["C12","F14"],["C12","F15"],
  ["F13","b17"],["F14","b18"],["F15","b19"],["b17","B20"],["b18","B21"],
  ["C12","R-11"],["C12","R-12"],["C12","R-13"],
  ["R-11","R-24"],["R-12","R-25"],["R-24","R-36"],["R-25","R-38"],
  ["R-38","R-49"],["R-49","R-511"],["R-36","R-48"],["R-48","R-510"]
];

// ══════ CANVAS SETUP ══════
const canvas = document.getElementById('tree-canvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('canvas-container');

const IMG_W = 1024, IMG_H = 1536;
let scale = 1, offsetX = 0, offsetY = 0;

const img = new Image();
img.src = 'templates/baobab_render_final.png';
img.onload = () => {
  resize();
  render();
  createHitboxes();
};

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min(vw / IMG_W, vh / IMG_H);
  canvas.width = IMG_W * scale;
  canvas.height = IMG_H * scale;
  offsetX = (vw - canvas.width) / 2;
  offsetY = (vh - canvas.height) / 2;
  canvas.style.position = 'absolute';
  canvas.style.left = offsetX + 'px';
  canvas.style.top = offsetY + 'px';
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
}

function createHitboxes() {
  document.querySelectorAll('.node-hitbox').forEach(e => e.remove());
  NODES.forEach(n => {
    const div = document.createElement('div');
    div.className = 'node-hitbox';
    div.dataset.id = n.id;
    div.dataset.lk = n.lk;
    div.style.left = (offsetX + n.x * scale) + 'px';
    div.style.top = (offsetY + n.y * scale) + 'px';
    const info = LAYER_INFO[n.lk];
    div.style.background = `radial-gradient(circle, ${info.color}cc, ${info.color}44, transparent)`;
    div.addEventListener('click', () => showPanel(n));
    container.appendChild(div);
  });
}

// ══════ PANEL ══════
const panel = document.getElementById('holo-panel');
let activeNode = null;

function showPanel(node) {
  const info = LAYER_INFO[node.lk];
  if (!info) return;

  // Deselect previous
  document.querySelectorAll('.node-hitbox.active').forEach(e => e.classList.remove('active'));
  document.querySelector(`[data-id="${node.id}"]`)?.classList.add('active');
  activeNode = node;

  document.getElementById('panel-name').textContent = node.id;
  document.getElementById('panel-layer').textContent = info.fullName;
  document.getElementById('panel-desc').textContent = info.desc;
  document.getElementById('panel-task').textContent = info.task;
  
  const promptsDiv = document.getElementById('panel-prompts');
  promptsDiv.innerHTML = '';
  info.prompts.forEach(p => {
    const box = document.createElement('div');
    box.className = 'ask-ai-box';
    box.innerHTML = `<div class="prompt">${p}</div>`;
    box.style.cursor = 'pointer';
    box.addEventListener('click', () => {
      navigator.clipboard?.writeText(p);
      box.style.borderColor = '#00ffcc';
      box.querySelector('.prompt').textContent = '✓ Copié !';
      setTimeout(() => {
        box.style.borderColor = '';
        box.querySelector('.prompt').textContent = p;
      }, 1500);
    });
    promptsDiv.appendChild(box);
  });

  panel.classList.add('visible');
}

function hidePanel() {
  panel.classList.remove('visible');
  document.querySelectorAll('.node-hitbox.active').forEach(e => e.classList.remove('active'));
  activeNode = null;
}

document.getElementById('close-btn').addEventListener('click', hidePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') hidePanel(); });

window.addEventListener('resize', () => {
  resize();
  render();
  createHitboxes();
});
</script>
</body>
</html>
